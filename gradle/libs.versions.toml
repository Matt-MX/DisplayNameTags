[versions]
shadow = "9.6.1"
runPaper = "3.1.0"

paper = "1.21.11-R0.1-SNAPSHOT"

placeholderapi = "2.12.3"
packetevents = "2.14.0"
tab = "5.5.0"
skinsrestorer = "15.11.0"
floodgate = "2.2.5-SNAPSHOT"
bstats = "3.2.1"
fastutil = "8.5.19"

junit-jupiter = "6.1.3"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
tab = { module = "com.github.NEZNAMY:TAB-API", version.ref = "tab" }
skinsrestorer = { module = "net.skinsrestorer:skinsrestorer-api", version.ref = "skinsrestorer" }
floodgate = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
