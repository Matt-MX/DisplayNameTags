[versions]
shadow = "9.6.1"
runPaper = "3.1.0"

paper = "26.3.build.26-alpha"

placeholderapi = "2.12.3"
packetevents = "2.13.0"
tab = "6.1.2"
skinsrestorer = "15.12.5"
entitylib = "3.3.7-SNAPSHOT"
bstats = "3.2.1"

junit-jupiter = "5.14.4"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
